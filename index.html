  <body>
    <div id="root"></div>
    <script>
      // Proactively unregister any stale service workers as early as possible.
      // This runs before any module script and reduces the window in which the
      // browser's background SW update-check can fire an "sw.js load failed" error.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function() {});
      }
      // When a hashed JS chunk fails to load (stale HTML after a new deploy),
      // reload the page once to fetch fresh HTML with updated chunk hashes.
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var src = e.target.src || e.target.href || '';
          if (src.indexOf('/assets/') !== -1 || (e.target.tagName === 'SCRIPT' && e.target.type === 'module')) {
            e.stopImmediatePropagation();
            var key = 'bip_chunk_reload';
            var last = sessionStorage.getItem(key);
            var now = Date.now();
            if (!last || (now - parseInt(last, 10)) > 30000) {
              sessionStorage.setItem(key, String(now));
              window.location.reload();
            }
          }
        }
      }, true);
      // Suppress service worker update errors that fire before the app's error
      // handlers are installed. Browsers with stale SW registrations emit
      // "sw.js load failed" unhandled rejections — suppress them early so they
      // never reach the self-heal monitoring system.
      function _isSWError(r) {
        try {
          var parts = [
            r && r.message ? String(r.message) : '',
            String(r || ''),
            r && r.stack ? String(r.stack) : '',
            r && r.filename ? String(r.filename) : '',
            r && r.url ? String(r.url) : '',
            r && r.name ? String(r.name) : ''
          ].join(' ').toLowerCase();
          return parts.indexOf('sw.js') !== -1 ||
                 parts.indexOf('registersw') !== -1 ||
                 parts.indexOf('workbox') !== -1 ||
                 parts.indexOf('serviceworker') !== -1 ||
                 parts.indexOf('service-worker') !== -1 ||
                 /load\s+failed/.test(parts) ||
                 /failed.*update.*service/.test(parts);
        } catch(e) { return false; }
      }
      window.addEventListener('unhandledrejection', function(e) {
        if (_isSWError(e.reason)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        var src = (e.filename || '') + ' ' + (e.message || '');
        if (src.indexOf('sw.js') !== -1 || src.indexOf('registerSW') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
