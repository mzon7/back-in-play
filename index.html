  <body>
    <div id="root"></div>
    <script>
      // When a hashed JS chunk fails to load (stale HTML after a new deploy),
      // reload the page once to fetch fresh HTML with updated chunk hashes.
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.type === 'module') {
          var key = 'bip_chunk_reload';
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          if (!last || (now - parseInt(last, 10)) > 30000) {
            sessionStorage.setItem(key, String(now));
            window.location.reload();
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
